          targetType: answer
        id: strip_riddle-ans_riddle
        source: strip_riddle
        sourceHandle: source
        target: ans_riddle
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: code
          targetType: answer
        id: strip_check-ans_check
        source: strip_check
        sourceHandle: source
        target: ans_check
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: code
          targetType: answer
        id: strip_hint-ans_hint
        source: strip_hint
        sourceHandle: source
        target: ans_hint
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: code
          targetType: answer
        id: strip_fact-ans_fact
        source: strip_fact
        sourceHandle: source
        target: ans_fact
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: code
          targetType: answer
        id: strip_chat-ans_chat
        source: strip_chat
        sourceHandle: source
        target: ans_chat
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: ""
          selected: false
          title: 开始
          type: start
          variables:
            - label: 用户提问
              max_length: 256
              options: []
              required: true
              type: paragraph
              variable: query
        height: 116
        id: start
        position:
          x: 80
          y: 300
        positionAbsolute:
          x: 80
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          classes:
            - id: "1"
              name: 出谜语
            - id: "2"
              name: 猜答案
            - id: "3"
              name: 要提示
            - id: "4"
              name: 冷知识
            - id: "5"
              name: 闲聊
          desc: ""
          instruction: "请判断用户意图：\n1. 出谜语：用户想让你出一道谜语（如“出个谜语”“来个动物谜语”）。\n2. 猜答案：用户给出了一个猜测/答案（如“是西瓜吗”“答案是月亮”）。\n3. 要提示：用户猜不出，想要提示。\n4. 冷知识：用户想听冷知识或问为什么/是什么等科普问题。\n5. 闲聊：其他内容（打招呼、询问功能等）。"
          model:
            completion_params:
              think: false
            mode: chat
            name: deepseek-r1:8b
            provider: ollama
          query_variable_selector:
            - start
            - query
          selected: false
          title: 意图分类
          topics: []
          type: question-classifier
        height: 200
        id: classifier
        position:
          x: 400
          y: 300
        positionAbsolute:
          x: 400
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          authorization:
            type: no-auth
          body:
            type: json
            data:
              - key: ""
                type: text
                value: '{"query": "{{#start.query#}}", "category": "riddle", "n": 3}'
          desc: "调用 seekdb 桥接服务，检索相关谜语（向量+全文混合）"
          headers: "Content-Type: application/json"
          method: post
          params: ""
          retry_config:
            max_retries: 3
            retry_enabled: true
            retry_interval: 100
          selected: false
          timeout:
            max_connect_timeout: 0
            max_read_timeout: 0
            max_write_timeout: 0
          title: 检索谜语
          type: http-request
          url: http://host.docker.internal:3001/api/retrieve
        height: 120
        id: fetch_riddle
        position:
          x: 700
          y: 120
        positionAbsolute:
          x: 700
          y: 120
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: "把检索结果（含谜底）保存到会话变量，供猜答案/要提示时使用"
          items:
            - input_type: variable
              operation: over-write
              value:
                - fetch_riddle
                - body
              variable_selector:
                - conversation
                - riddle_context
          selected: false
          title: 保存谜语上下文
          type: assigner
          version: "2"
        height: 120
        id: save_riddle
        position:
          x: 1000
          y: 120
        positionAbsolute:
          x: 1000
          y: 120
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: ""
          memory:
            role_prefix:
              assistant: ""
              user: ""
            window:
              enabled: false
              size: 10
            query_prompt_template: "{{#sys.query#}}"
          model:
            completion_params:
              think: false
            mode: chat
            name: deepseek-r1:8b
            provider: ollama
          prompt_template:
            - id: pr-sys
              role: system
              text: "你是「谜海拾贝」，一个幽默风趣的谜语主持人。下面 JSON 是 seekdb 混合检索返回的候选谜语（results 数组里每条有 document 谜面、metadata.answer 谜底、metadata.category 分类、metadata.difficulty 难度）。\n\n请从中挑选最合适的一条，向用户出题：\n1. 只输出谜面（document），并带上分类/难度标签；\n2. 绝对不要透露谜底（metadata.answer）；\n3. 语气活泼，鼓励用户猜，并提示“猜不出可以说‘要提示’”。"
            - id: pr-usr
              role: user
              text: "用户请求：{{#start.query#}}\n\n检索结果：{{#fetch_riddle.body#}}"
          selected: false
          title: 出谜题
          type: llm
          variables: []
          vision:
            enabled: false
        height: 120
        id: present_riddle
        position:
          x: 1300
          y: 120
        positionAbsolute:
          x: 1300
          y: 120
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |
            import re
            def main(text: str) -> dict:
                cleaned = re.sub(r'<\s*think\s*>.*?<\s*/\s*think\s*>', '', text or '', flags=re.DOTALL).strip()
                return {"result": cleaned}
          code_language: python3
          desc: 去除模型思考内容，仅保留最终回答
          outputs:
            result:
              children: null
              type: string
          selected: false
          title: 去除思考
          type: code
          variables:
            - value_selector:
                - present_riddle
                - text
              variable: text
        height: 54
        id: strip_riddle
