        source: fetch_fact
        sourceHandle: source
        target: answer_fact
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: llm
          targetType: code
        id: answer_fact-strip_fact
        source: answer_fact
        sourceHandle: source
        target: strip_fact
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: llm
          targetType: code
