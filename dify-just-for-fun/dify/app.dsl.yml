app:
  description: "谜海拾贝 —— 一个会出谜语、陪你猜谜、还能讲冷知识的好玩智能助手。基于 Dify + OceanBase seekdb（向量+全文混合检索）实现。"
  icon: 🧩
  icon_background: "#FFEAD5"
  mode: advanced-chat
  name: 谜海拾贝
  use_icon_as_answer_icon: false
kind: app
version: 0.1.2
workflow:
  conversation_variables:
    - description: 当前谜语的完整上下文（含谜面与谜底），用于后续校验用户答案
      id: "cv_riddle_context"
      name: riddle_context
      selector:
        - conversation
        - riddle_context
      value: ""
      value_type: string
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods:
        - local_file
        - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
          - local_file
          - remote_url
    opening_statement: "你好呀，我是「谜海拾贝」🎣 一个既会出谜语、又能陪你猜谜，还满肚子冷知识的小助手。\n\n你可以试试：\n- “给我出一个关于动物的谜语”\n- “来个简单的谜语”\n- “讲一个冷知识”\n- “为什么天空是蓝色的？”\n\n出完谜语后，直接告诉我你的答案，我会告诉你对不对，猜不出还能找我要提示哦～"
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
      - 给我出一个关于动物的谜语
      - 讲一个有趣的冷知识
      - 为什么天空是蓝色的？
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ""
      voice: ""
  graph:
    edges:
      - data:
          isInIteration: false
          sourceType: start
          targetType: question-classifier
        id: start-classifier
        source: start
        sourceHandle: source
        target: classifier
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: question-classifier
          targetType: http-request
        id: classifier-1-fetch_riddle
        source: classifier
        sourceHandle: "1"
        target: fetch_riddle
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: question-classifier
          targetType: llm
        id: classifier-2-check_answer
        source: classifier
        sourceHandle: "2"
        target: check_answer
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: question-classifier
          targetType: llm
        id: classifier-3-give_hint
        source: classifier
        sourceHandle: "3"
        target: give_hint
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: question-classifier
          targetType: http-request
        id: classifier-4-fetch_fact
        source: classifier
        sourceHandle: "4"
        target: fetch_fact
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: question-classifier
          targetType: llm
        id: classifier-5-chat
        source: classifier
        sourceHandle: "5"
        target: chat
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: http-request
          targetType: variable-assigner
        id: fetch_riddle-save_riddle
        source: fetch_riddle
        sourceHandle: source
        target: save_riddle
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: variable-assigner
          targetType: llm
        id: save_riddle-present_riddle
        source: save_riddle
        sourceHandle: source
        target: present_riddle
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: llm
          targetType: code
        id: present_riddle-strip_riddle
        source: present_riddle
        sourceHandle: source
        target: strip_riddle
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: llm
          targetType: code
        id: check_answer-strip_check
        source: check_answer
        sourceHandle: source
        target: strip_check
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
